query AllPartners($locale: SiteLocale, $yearId: ItemId, $first: IntType = 100, $skip: IntType = 0) {
	allPartners(
		filter: { year: { eq: $yearId } }
		locale: $locale
		first: $first
		skip: $skip
		orderBy: title_ASC
	) {
		...PartnerFragmentLight
	}
	_allPartnersMeta(locale: $locale, filter: { year: { eq: $yearId } }) {
		count
	}
	financiers: year(filter: { id: { eq: $yearId } }, locale: $locale) {
		fundedBy {
			id
			url
			logo {
				...ImageMediumFragment
			}
		}
	}
}

query Partner($slug: String!, $locale: SiteLocale) {
	partner(filter: { slug: { eq: $slug } }, locale: $locale) {
		...PartnerFragment
	}
}

fragment PartnerFragment on PartnerRecord {
	__typename
	_createdAt
	_editingUrl
	id
	title
	intro(markdown: false)
	slug
	_allSlugLocales {
		locale
		value
	}
	image {
		...ImageFragment
	}
	imageEn {
		...ImageFragment
	}
	year {
		...YearFragment
	}
	address
	city
	webpage
	content {
		value
		blocks {
			__typename
			... on ImageRecord {
				__typename
				id
				layout
				image {
					...ImageFragment
				}
			}
			... on ImageGalleryRecord {
				__typename
				id
				images {
					...ImageThumbnailFragment
				}
			}
			... on LogoTypeRecord {
				__typename
				id
				logotypes {
					...ImageFragment
				}
			}
			... on ButtonRecord {
				__typename
				id
				link {
					__typename
					... on ExternalLinkRecord {
						__typename
						id
						title
						url
					}
					... on InternalLinkRecord {
						__typename
						id
						title
						record {
							__typename

							... on AboutRecord {
								id
								slug
								title
								year {
									title
								}
							}
							... on ExhibitionRecord {
								id
								slug
								title
								year {
									title
								}
							}
							... on LocationRecord {
								id
								slug
								title
								year {
									title
								}
							}
							... on NewsRecord {
								id
								slug
								title
							}
							... on ParticipantRecord {
								id
								slug
								name
								year {
									title
								}
							}
							... on ProgramRecord {
								id
								slug
								title
								year {
									title
								}
							}
						}
					}
				}
			}
			... on VideoRecord {
				__typename
				id
				title
				video {
					height
					width
					title
					provider
					providerUid
					thumbnailUrl
					url
				}
			}
			... on RecordInterface {
				__typename
				id
			}
		}
	}
	_seoMetaTags {
		...SeoMetaTagsFragment
	}
}

fragment PartnerFragmentLight on PartnerRecord {
	__typename
	_editingUrl
	id
	title
	intro(markdown: false)
	image {
		...ImageThumbnailFragment
	}
	year {
		...YearFragmentLight
	}
	slug
}
