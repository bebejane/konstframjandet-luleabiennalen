query Contact($locale: SiteLocale) {
	contact(locale: $locale) {
		__typename
		id
		image {
			...ImageFragment
		}
		intro(markdown: false)
		slug
		title
		content {
			value
			blocks {
				__typename
				... on ImageRecord {
					__typename
					id
					layout
					image {
						...ImageFragment
					}
				}
				... on ImageGalleryRecord {
					__typename
					id
					images {
						...ImageThumbnailFragment
					}
				}
				... on ButtonRecord {
					__typename
					id
					link {
						__typename
						... on ExternalLinkRecord {
							__typename
							id
							title
							url
						}
						... on InternalLinkRecord {
							__typename
							id
							title
							record {
								__typename

								... on AboutRecord {
									id
									slug
									title
									year {
										title
									}
								}
								... on ExhibitionRecord {
									id
									slug
									title
									year {
										title
									}
								}
								... on LocationRecord {
									id
									slug
									title
									year {
										title
									}
								}
								... on NewsRecord {
									id
									slug
									title
								}
								... on ParticipantRecord {
									id
									slug
									name
									year {
										title
									}
								}
								... on ProgramRecord {
									id
									slug
									title
									year {
										title
									}
								}
							}
						}
					}
				}
				... on VideoRecord {
					__typename
					id
					title
					video {
						height
						width
						title
						provider
						providerUid
						thumbnailUrl
						url
					}
				}
				... on RecordInterface {
					__typename
					id
				}
			}
		}
		_seoMetaTags {
			...SeoMetaTagsFragment
		}
	}
}
