query AllParticipants($locale: SiteLocale, $yearId: ItemId, $first: IntType = 100, $skip: IntType = 0) {
	allParticipants(
		filter: { year: { eq: $yearId } }
		locale: $locale
		first: $first
		skip: $skip
		orderBy: name_ASC
	) {
		...ParticipantFragmentLight
	}
	_allParticipantsMeta(locale: $locale, filter:  {
		 year:  {
				eq: $yearId
		 }
	}) {
		count
	}
}

query Participant($slug: String, $locale: SiteLocale) {
	participant(filter: { slug: { eq: $slug } }, locale: $locale) {
		...ParticipantFragment
	}
}

fragment ParticipantFragment on ParticipantRecord {
	_createdAt
	id
	name
	intro(markdown: false)
	slug
	_allSlugLocales {
		locale
		value
	}
	image {
		...ImageFragment
	}
	imageEn {
		...ImageFragment
	}
	year {
		...YearFragment
	}
	exhibitions: _allReferencingExhibitions(first: 100) {
		...ExhibitionFragmentLight
	}
	programs: _allReferencingPrograms(first: 100) {
		...ProgramFragmentLight
	}
	colab {
		...PartnerFragment
	}
	content {
		value
		blocks {
			__typename
			... on ImageRecord {
				__typename
				id
				layout
				image {
					...ImageFragment
				}
			}
			... on ImageGalleryRecord {
				__typename
				id
				images {
					...ImageThumbnailFragment
				}
			}
			... on LogoTypeRecord {
				__typename
				id
				logotypes {
					...ImageFragment
				}
			}
			... on ButtonRecord {
				__typename
				id
				link {
					__typename
					... on ExternalLinkRecord {
						__typename
						id
						title
						url
					}
					... on InternalLinkRecord {
						__typename
						id
						title
						record {
							... on AboutRecord {
								id
								slug
								title
							}
							... on ExhibitionRecord {
								id
								slug
								title
							}
							... on LocationRecord {
								id
								slug
								title
							}
							... on NewsRecord {
								id
								slug
								title
							}
							... on ParticipantRecord {
								id
								slug
								name
							}
							... on ProgramRecord {
								id
								slug
								title
							}
						}
					}
				}
			}
			... on VideoRecord {
				__typename
				id
				title
				video {
					height
					width
					title
					provider
					providerUid
					thumbnailUrl
					url
				}
			}
			... on RecordInterface {
				__typename
				id
			}
		}
	}
	_seoMetaTags {
		...SeoMetaTagsFragment
	}
}

fragment ParticipantFragmentLight on ParticipantRecord {
	id
	name
	intro(markdown: false)
	image {
		...ImageThumbnailFragment
	}
	imageEn {
		...ImageFragment
	}
	year {
		...YearFragment
	}
	slug
	_createdAt
}
