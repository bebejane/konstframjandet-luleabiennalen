query Sitemap($locale: SiteLocale!) {
	allAbouts(locale: $locale, first: 500) {
		__typename
		_updatedAt
		slug
		year {
			title
		}
	}
	_allAboutsMeta(locale: $locale) {
		count
	}
	allExhibitions(locale: $locale, first: 500) {
		__typename
		_updatedAt
		slug
		year {
			title
		}
	}
	_allExhibitionsMeta(locale: $locale) {
		count
	}
	allLocations(locale: $locale, first: 500) {
		__typename
		_updatedAt
		slug
		year {
			title
		}
	}
	_allLocationsMeta(locale: $locale) {
		count
	}
	allNews(locale: $locale, first: 500) {
		__typename
		_updatedAt
		slug
	}
	_allNewsMeta(locale: $locale) {
		count
	}
	allParticipants(locale: $locale, first: 500) {
		__typename
		_updatedAt
		slug
		year {
			title
		}
	}
	_allParticipantsMeta(locale: $locale) {
		count
	}
	allPartners(locale: $locale, first: 500) {
		__typename
		_updatedAt
		slug
		year {
			title
		}
	}
	_allPartnersMeta(locale: $locale) {
		count
	}
	allPrograms(locale: $locale, first: 500) {
		__typename
		_updatedAt
		slug
		year {
			title
		}
	}
	_allProgramsMeta(locale: $locale) {
		count
	}
	allYears(locale: $locale, first: 500) {
		__typename
		_updatedAt
		title
	}
	_allYearsMeta(locale: $locale) {
		count
	}
}
