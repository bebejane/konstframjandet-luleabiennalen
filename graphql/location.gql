query AllLocations(
	$first: IntType = 100
	$skip: IntType = 0
	$locale: SiteLocale
	$yearId: ItemId
) {
	allLocations(
		filter: { year: { eq: $yearId } }
		first: $first
		skip: $skip
		orderBy: [title_ASC]
		locale: $locale
	) {
		...LocationFragmentLight
	}

	_allLocationsMeta(locale: $locale, filter: { year: { eq: $yearId } }) {
		count
	}
}

query Location($slug: String!, $locale: SiteLocale) {
	location(filter: { slug: { eq: $slug } }, locale: $locale) {
		...LocationFragment
	}
}

fragment LocationFragment on LocationRecord {
	__typename
	id
	title
	city
	address
	image {
		...ImageFragment
	}
	imageEn {
		...ImageFragment
	}
	intro(markdown: false)
	webpage
	slug
	_allSlugLocales {
		locale
		value
	}
	exhibitions: _allReferencingExhibitions(first: 100) {
		...ExhibitionFragmentLight
	}
	programs: _allReferencingPrograms(first: 100) {
		...ProgramFragmentLight
	}
	content {
		value
		blocks {
			__typename
			... on ImageRecord {
				__typename
				id
				layout
				image {
					...ImageFragment
				}
			}
			... on ImageGalleryRecord {
				__typename
				id
				images {
					...ImageThumbnailFragment
				}
			}
			... on LogoTypeRecord {
				__typename
				id
				logotypes {
					...ImageFragment
				}
			}
			... on ButtonRecord {
				__typename
				id
				link {
					__typename
					... on ExternalLinkRecord {
						__typename
						id
						title
						url
					}
					... on InternalLinkRecord {
						__typename
						id
						title
						record {
							__typename

							... on AboutRecord {
								id
								slug
								title
								year {
									title
								}
							}
							... on ExhibitionRecord {
								id
								slug
								title
								year {
									title
								}
							}
							... on LocationRecord {
								id
								slug
								title
								year {
									title
								}
							}
							... on NewsRecord {
								id
								slug
								title
							}
							... on ParticipantRecord {
								id
								slug
								name
								year {
									title
								}
							}
							... on ProgramRecord {
								id
								slug
								title
								year {
									title
								}
							}
						}
					}
				}
			}
			... on VideoRecord {
				__typename
				id
				title
				video {
					height
					width
					title
					provider
					providerUid
					thumbnailUrl
					url
				}
			}
			... on RecordInterface {
				__typename
				id
			}
		}
	}
	_seoMetaTags {
		...SeoMetaTagsFragment
	}
}

fragment LocationFragmentLight on LocationRecord {
	__typename
	id
	title
	city
	address
	intro(markdown: false)
	webpage
	slug
	image {
		...ImageThumbnailFragment
	}
	imageEn {
		...ImageThumbnailFragment
	}

	year {
		id
		title
	}
}
